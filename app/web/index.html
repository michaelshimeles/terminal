<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<title>Terminal</title>
		<link rel="icon" href="data:," />
		<script>
			// The WebGPU build when the browser has WebGPU, else the larger WebGL2 one (no charts).
			// Start downloading now; the module below confirms there is an adapter.
			window.terminalBuild = 'gpu' in navigator ? 'terminal' : 'terminal-webgl';
			for (const [rel, file] of [
				['modulepreload', `${terminalBuild}.js`],
				['preload', `${terminalBuild}_bg.wasm`]
			]) {
				const link = Object.assign(document.createElement('link'), { rel, href: `./${file}` });
				if (rel === 'preload') Object.assign(link, { as: 'fetch', type: 'application/wasm', crossOrigin: '' });
				document.head.append(link);
			}
		</script>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #1e1e20;
			}
			@media (prefers-color-scheme: light) {
				html,
				body {
					background: #f5f5f7;
				}
			}
			canvas {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				outline: none;
			}
			#status {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				margin: 0;
				font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				color: #8e8e93;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<canvas id="terminal"></canvas>
		<p id="status">Loading Terminal…</p>
		<script type="module">
			let build = window.terminalBuild;
			if (build === 'terminal' && !(await navigator.gpu.requestAdapter().catch(() => null))) {
				build = 'terminal-webgl';
			}
			try {
				const { default: init } = await import(`./${build}.js`);
				await init(); // Runs the app; it removes #status after its first frame.
			} catch (e) {
				console.error(e);
				document.getElementById('status').textContent = `Terminal couldn't start: ${e}`;
			}
		</script>
	</body>
</html>
