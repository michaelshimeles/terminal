[package]
name = "tr-gateway"
description = "Terminal data server: one upstream feed fanned out to every Terminal client"
version.workspace = true
edition.workspace = true

[dependencies]
tr-core.workspace = true
tr-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
async-trait = "0.1"
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
# The CLI example and the integration tests talk to the gateway through the desktop's client.
tr-data.workspace = true
tokio = { workspace = true, features = ["net", "signal", "test-util"] }
