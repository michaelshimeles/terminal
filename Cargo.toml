[workspace]
resolver = "2"
members = ["crates/core", "crates/broker", "crates/congress", "crates/data", "crates/chart", "crates/macos", "app"]
default-members = ["app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tr-core = { path = "crates/core" }
tr-broker = { path = "crates/broker" }
tr-congress = { path = "crates/congress" }
tr-data = { path = "crates/data" }
tr-chart = { path = "crates/chart" }
tr-macos = { path = "crates/macos" }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json", "gzip", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev.package."*"]
opt-level = 2

# The browser build (scripts/build-web.sh): one fully optimised unit, no debug info, so the
# .wasm is as small as it gets before wasm-opt.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
strip = true
