[package]
name = "tr-broker"
description = "Brokerage accounts through SnapTrade: signed API client, portfolio model, order entry and credential storage"
version.workspace = true
edition.workspace = true

[dependencies]
tr-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Hyperliquid agent keys on Linux: the Secret Service over D-Bus (pure Rust, no libdbus).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

# The browser build never calls SnapTrade (see `SnapTrade::with_base`); the client only compiles.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
reqwest.workspace = true
