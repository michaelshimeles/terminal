[package]
name = "tr-chart"
description = "GPU chart rendering (wgpu) with LOD pyramids, viewport math and egui integration"
version.workspace = true
edition.workspace = true

[dependencies]
tr-core.workspace = true
egui = { version = "0.36", default-features = false }
# GPU backends come from the app (eframe), so the browser build can leave out WebGL.
egui-wgpu = { version = "0.36", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
chrono.workspace = true
serde.workspace = true
pollster = "0.4"

[dev-dependencies]
criterion.workspace = true
# Tests, benches and examples render offscreen on a real backend.
egui-wgpu = "0.36"

[[bench]]
name = "frame"
harness = false
